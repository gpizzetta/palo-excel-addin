<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Ecriture PALO.DATAC</title>
  <link rel="icon" href="/palo-excel-addin/favicon.ico" type="image/x-icon">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --palo-bg: #f3f2f1;
      --palo-surface: #ffffff;
      --palo-border: #edebe9;
      --palo-text: #323130;
      --palo-text-secondary: #605e5c;
      --palo-input-bg: #ffffff;
      --palo-input-border: #8a8886;
      --palo-focus: #0078d4;
      --palo-button: #0078d4;
      --palo-button-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --palo-bg: #1f1f1f;
        --palo-surface: #292827;
        --palo-border: #3b3a39;
        --palo-text: #ffffff;
        --palo-text-secondary: #c8c6c4;
        --palo-input-bg: #292827;
        --palo-input-border: #8a8886;
        --palo-focus: #2899f5;
        --palo-button: #0078d4;
        --palo-button-text: #ffffff;
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: var(--palo-text);
      background: var(--palo-bg);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      padding: 10px 12px;
      border-bottom: 1px solid var(--palo-border);
      background: var(--palo-surface);
    }
    main {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .fields {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #value-block[hidden],
    #like-block[hidden] { display: none; }
    #like-dims { display: flex; flex-direction: column; gap: 8px; }
    p { margin: 0; }
    .hint { color: var(--palo-text-secondary); font-size: 12px; line-height: 1.4; }
    #action-help { margin-top: 6px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--palo-text-secondary);
      margin-bottom: 4px;
    }
    input, select {
      box-sizing: border-box;
      width: 100%;
      padding: 6px 8px;
      font: inherit;
      color: var(--palo-text);
      background: var(--palo-input-bg);
      border: 1px solid var(--palo-input-border);
      border-radius: 2px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--palo-focus);
      box-shadow: 0 0 0 1px var(--palo-focus) inset;
    }
    .actions {
      margin-top: auto;
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }
    button {
      font: inherit;
      min-width: 96px;
      padding: 6px 14px;
      border: 1px solid var(--palo-button);
      border-radius: 2px;
      background: var(--palo-button);
      color: var(--palo-button-text);
      cursor: pointer;
      text-align: center;
    }
    button.secondary {
      background: #ffffff;
      color: var(--palo-text);
      border-color: var(--palo-input-border);
    }
    html.theme-dark button.secondary {
      background: var(--palo-surface);
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { min-height: 1.2em; white-space: pre-wrap; }
    .alert {
      margin-top: 4px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 2px;
      white-space: pre-wrap;
    }
    .alert-danger {
      color: #842029;
      background: #f8d7da;
      border-color: #f5c2c7;
    }
    @media (prefers-color-scheme: dark) {
      button.secondary {
        background: var(--palo-surface);
      }
      .alert-danger {
        color: #f8d7da;
        background: #58151c;
        border-color: #842029;
      }
    }
    html.theme-dark .alert-danger {
      color: #f8d7da;
      background: #58151c;
      border-color: #842029;
    }
  </style>
</head>
<body>
  <h1>Ecriture PALO.DATAC</h1>
  <main>
    <div class="fields">
    <p id="summary" class="hint">Lecture de la selection...</p>
    <div>
      <label for="action">Action</label>
      <select id="action">
        <option value="replace" selected>Remplacer</option>
        <option value="add">Ajouter</option>
        <option value="add-pct">Ajouter en %</option>
        <option value="set-pct">Pourcentage de la cellule</option>
        <option value="copy">Copier</option>
      </select>
      <p id="action-help" class="hint">Remplace la valeur de la cellule par le nombre saisi.</p>
    </div>
    <div id="value-block">
      <label for="value" id="value-label">Valeur</label>
      <input id="value" type="text" spellcheck="false" autocomplete="off" placeholder="Ex. 100">
    </div>
    <div id="like-block" hidden>
      <p id="like-hint" class="hint">Chemin source. Les listes partent du chemin de la cellule.</p>
      <div id="like-dims"></div>
    </div>
    <p id="status" class="hint"></p>
    <div id="alert-danger" class="alert alert-danger" role="alert" hidden></div>
    </div>
    <div class="actions">
      <button type="button" id="btn-cancel" class="secondary">Annuler</button>
      <button type="button" id="btn-apply">Appliquer</button>
    </div>
  </main>
  <script>
    var STORAGE_KEY = "palo_datac_write_v1";
    var PREFS_KEY = "palo_datac_write_prefs_v1";
    var state = { cells: [], busy: false, writeMode: "replace" };
    var ACTIONS_BASE = [
      { id: "replace", label: "Remplacer", value: "amount", path: false, help: "Remplace la valeur de la cellule par le nombre saisi." },
      { id: "add", label: "Ajouter", value: "amount", path: false, help: "Ajoute le nombre saisi a la valeur actuelle. 200 et 10 donnent 210." },
      { id: "add-pct", label: "Ajouter en %", value: "percent", path: false, help: "Ajoute ce pourcentage a la valeur actuelle. 200 et 10 donnent 220." },
      { id: "set-pct", label: "Pourcentage de la cellule", value: "percent", path: false, help: "Remplace la cellule par ce pourcentage de sa valeur. 200 et 10 donnent 20." },
      { id: "copy", label: "Copier", value: "none", path: true, help: "Copie les valeurs du chemin source vers cette cellule." }
    ];
    var ACTIONS_CONSOLIDATED = [
      { id: "spread", label: "Repartir", value: "amount", path: false, help: "Repartit le nombre saisi sur les bases du regroupement." },
      { id: "add-total", label: "Ajouter au total", value: "amount", path: false, help: "Augmente le total du nombre saisi, puis le repartit. 100 et 10 donnent 110." },
      { id: "add-total-pct", label: "Ajouter un % au total", value: "percent", path: false, help: "Augmente le total de ce pourcentage, puis le repartit. 100 et 10 donnent 110." },
      { id: "set-total-pct", label: "Passer le total a %", value: "percent", path: false, help: "Remplace le total par ce pourcentage, puis le repartit. 100 et 10 donnent 10." },
      { id: "set-bases", label: "Ecrire sur chaque base", value: "amount", path: false, help: "Ecrit le meme nombre sur chaque cellule de base." },
      { id: "add-bases", label: "Ajouter a chaque base", value: "amount", path: false, help: "Ajoute le meme nombre a chaque cellule de base." },
      { id: "like", label: "Reprendre une repartition", value: "amount", path: true, help: "Reprend les proportions du chemin source et y pose le nombre saisi." },
      { id: "like-add", label: "Reprendre et ajouter", value: "amount", path: true, help: "Reprend le chemin source et ajoute le nombre saisi a son total." },
      { id: "like-pct", label: "Pourcentage du modele", value: "percent", path: true, help: "Pose ce pourcentage de la valeur du chemin source." },
      { id: "like-add-pct", label: "Ajouter en % au modele", value: "percent", path: true, help: "Ajoute ce pourcentage a la valeur du chemin source. 200 et 10 donnent 220." },
      { id: "copy", label: "Copier", value: "none", path: true, help: "Copie les valeurs du chemin source, sans les modifier." }
    ];

    function applyOfficeTheme() {
      var theme = Office.context && Office.context.officeTheme;
      if (!theme) {
        return;
      }
      var root = document.documentElement;
      function setVar(name, value) {
        if (value) {
          root.style.setProperty(name, value);
        }
      }
      setVar("--palo-bg", theme.bodyBackgroundColor);
      setVar("--palo-text", theme.bodyForegroundColor);
      setVar("--palo-surface", theme.controlBackgroundColor || theme.bodyBackgroundColor);
      setVar("--palo-input-bg", theme.controlBackgroundColor);
      if (theme.isDarkTheme) {
        document.documentElement.classList.add("theme-dark");
      }
    }

    function setStatus(text, kind) {
      var alertEl = document.getElementById("alert-danger");
      var hint = document.getElementById("status");
      if (kind === "error" && text) {
        alertEl.hidden = false;
        alertEl.textContent = text;
        hint.textContent = "";
        return;
      }
      alertEl.hidden = true;
      alertEl.textContent = "";
      hint.textContent = text || "";
    }

    function pathLabel(cell) {
      return (cell.coordinates || []).join(", ");
    }

    function actionList() {
      return state.writeMode === "bulk" ? ACTIONS_CONSOLIDATED : ACTIONS_BASE;
    }

    function currentAction() {
      var id = document.getElementById("action").value;
      var list = actionList();
      var i;
      for (i = 0; i < list.length; i += 1) {
        if (list[i].id === id) {
          return list[i];
        }
      }
      return list[0];
    }

    function readLocalPrefs() {
      try {
        var raw = window.localStorage.getItem(PREFS_KEY);
        if (!raw) {
          return null;
        }
        var data = JSON.parse(raw);
        return data && typeof data === "object" ? data : null;
      } catch (_prefs) {
        return null;
      }
    }

    function prefsForOpen(payload) {
      var incoming = payload && payload.prefs && typeof payload.prefs === "object" ? payload.prefs : null;
      var local = readLocalPrefs();
      if (!incoming) {
        return local;
      }
      if (!local) {
        return incoming;
      }
      var actionByMode = {};
      var key;
      var localActions = local.actionByMode || {};
      var incomingActions = incoming.actionByMode || {};
      for (key in localActions) {
        if (Object.prototype.hasOwnProperty.call(localActions, key)) {
          actionByMode[key] = localActions[key];
        }
      }
      for (key in incomingActions) {
        if (Object.prototype.hasOwnProperty.call(incomingActions, key)) {
          actionByMode[key] = incomingActions[key];
        }
      }
      var axes = {};
      var localAxes = local.axes || {};
      var incomingAxes = incoming.axes || {};
      for (key in localAxes) {
        if (Object.prototype.hasOwnProperty.call(localAxes, key)) {
          axes[key] = localAxes[key];
        }
      }
      for (key in incomingAxes) {
        if (Object.prototype.hasOwnProperty.call(incomingAxes, key)) {
          axes[key] = incomingAxes[key];
        }
      }
      return { actionByMode: actionByMode, axes: axes };
    }

    function rememberChoice() {
      var prefs = readLocalPrefs() || {};
      var actionByMode = prefs.actionByMode || {};
      var mode = state.writeMode === "bulk" ? "bulk" : "replace";
      actionByMode[mode] = currentAction().id;
      var axes = prefs.axes || {};
      var selects = document.querySelectorAll("#like-dims select");
      var i;
      for (i = 0; i < selects.length; i += 1) {
        var dim = selects[i].getAttribute("data-dimension");
        if (dim && selects[i].value) {
          axes[dim] = selects[i].value;
        }
      }
      var next = { actionByMode: actionByMode, axes: axes };
      try {
        window.localStorage.setItem(PREFS_KEY, JSON.stringify(next));
      } catch (_save) {
        // Le parent enregistre aussi ces choix a la validation.
      }
      return next;
    }

    function selectHasValue(select, value) {
      var i;
      for (i = 0; i < select.options.length; i += 1) {
        if (select.options[i].value === value) {
          return true;
        }
      }
      return false;
    }

    function applyRemembered(prefs) {
      if (!prefs) {
        applyActionFields();
        return;
      }
      var mode = state.writeMode === "bulk" ? "bulk" : "replace";
      var actionId = prefs.actionByMode && prefs.actionByMode[mode];
      var actionSelect = document.getElementById("action");
      if (actionId && selectHasValue(actionSelect, actionId)) {
        actionSelect.value = actionId;
      }
      var axes = prefs.axes || {};
      var selects = document.querySelectorAll("#like-dims select");
      var i;
      for (i = 0; i < selects.length; i += 1) {
        var dim = selects[i].getAttribute("data-dimension");
        var saved = dim ? axes[dim] : "";
        if (saved && selectHasValue(selects[i], String(saved))) {
          selects[i].value = String(saved);
        }
      }
      applyActionFields();
    }

    function fillActions() {
      var select = document.getElementById("action");
      var previous = select.value;
      var list = actionList();
      var allowed = false;
      var i;
      select.innerHTML = "";
      for (i = 0; i < list.length; i += 1) {
        var opt = document.createElement("option");
        opt.value = list[i].id;
        opt.textContent = list[i].label;
        if (list[i].id === previous) {
          opt.selected = true;
          allowed = true;
        }
        select.appendChild(opt);
      }
      if (!allowed && list[0]) {
        select.value = list[0].id;
      }
    }

    function collectPath() {
      if (!currentAction().path || document.getElementById("like-block").hidden) {
        return null;
      }
      var selects = document.querySelectorAll("#like-dims select");
      var path = {};
      var i;
      for (i = 0; i < selects.length; i += 1) {
        var chosen = selects[i].value;
        var current = selects[i].getAttribute("data-current") || "";
        if (chosen && chosen !== current) {
          path[selects[i].getAttribute("data-dimension")] = chosen;
        }
      }
      return path;
    }

    function applyActionFields() {
      var action = currentAction();
      var valueBlock = document.getElementById("value-block");
      var label = document.getElementById("value-label");
      var input = document.getElementById("value");
      var pathBlock = document.getElementById("like-block");
      valueBlock.hidden = action.value === "none";
      label.textContent = action.value === "percent" ? "Pourcentage" : "Valeur";
      input.placeholder = action.value === "percent" ? "Ex. 10" : "Ex. 100";
      pathBlock.hidden = !(action.path && state.dimensions && state.dimensions.length);
      var help = document.getElementById("action-help");
      if (help) {
        help.textContent = action.help || "";
      }
    }

    function renderLike(dimensions) {
      var host = document.getElementById("like-dims");
      host.innerHTML = "";
      state.dimensions = Array.isArray(dimensions) ? dimensions : [];
      state.dimensions.forEach(function (dim) {
        var wrap = document.createElement("div");
        var label = document.createElement("label");
        label.textContent = dim.name;
        var select = document.createElement("select");
        select.setAttribute("data-dimension", dim.name);
        select.setAttribute("data-current", dim.current || "");
        var names = Array.isArray(dim.elements) ? dim.elements.slice() : [];
        if (dim.current && names.indexOf(dim.current) < 0) {
          names.unshift(dim.current);
        }
        names.forEach(function (name) {
          var opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          if (name === dim.current) {
            opt.selected = true;
          }
          select.appendChild(opt);
        });
        wrap.appendChild(label);
        wrap.appendChild(select);
        host.appendChild(wrap);
      });
      applyActionFields();
    }

    function render(payload) {
      state.cells = payload && Array.isArray(payload.cells) ? payload.cells : [];
      var summary = document.getElementById("summary");
      var active = null;
      var i;
      var cubes = {};
      for (i = 0; i < state.cells.length; i += 1) {
        if (state.cells[i].active) {
          active = state.cells[i];
        }
        cubes[String(state.cells[i].servdb || "") + " / " + String(state.cells[i].cube || "")] = true;
      }
      if (!active && state.cells.length) {
        active = state.cells[0];
      }
      var cubeNames = Object.keys(cubes);
      var lines = [];
      if (active) {
        lines.push("Cellule active : " + (active.address || "") + " — " + active.cube);
        lines.push(pathLabel(active));
      }
      lines.push(state.cells.length + " cellule(s) PALO.DATAC.");
      var missing = payload && Array.isArray(payload.missing) ? payload.missing : [];
      state.writeMode = payload && payload.writeMode === "bulk" ? "bulk" : "replace";
      state.missing = missing;
      if (missing.length) {
        lines.push("Chemin incomplet.");
      } else if (state.writeMode === "bulk") {
        var groups = payload && Array.isArray(payload.consolidated) ? payload.consolidated : [];
        lines.push(groups.length
          ? "Regroupement : " + groups.join(", ") + "."
          : "Element regroupe : cell replace bulk.");
      } else {
        lines.push("Aucun element regroupe : cell replace.");
      }
      if (!missing.length && state.writeMode === "bulk" && cubeNames.length > 1) {
        lines.push(cubeNames.length + " cubes : le bulk est envoye par cube.");
      }
      if (payload && payload.truncated) {
        lines.push("Selection tronquee a " + state.cells.length + " cellules.");
      }
      if (payload && payload.skipped) {
        lines.push(payload.skipped + " formule(s) ignoree(s) (coordonnee vide ou illisible).");
      }
      summary.textContent = lines.join(" ");
      state.dimensions = payload && Array.isArray(payload.dimensions) ? payload.dimensions : [];
      state.prefs = prefsForOpen(payload);
      fillActions();
      renderLike(state.dimensions);
      applyRemembered(state.prefs);
      var canWrite = !missing.length;
      document.getElementById("btn-apply").disabled = !canWrite;
      document.getElementById("action").disabled = !canWrite;
      document.getElementById("value").disabled = !canWrite || currentAction().value === "none";
      if (missing.length) {
        setStatus(missing.map(function (item) {
          return item && item.message
            ? item.message
            : "Element " + (item && item.element ? item.element : "") + " introuvable dans la dimension " + (item && item.dimension ? item.dimension : "");
        }).join("\n"), "error");
      } else {
        setStatus("", "");
      }
      var valueInput = document.getElementById("value");
      if (valueInput && typeof valueInput.focus === "function") {
        try {
          valueInput.focus();
        } catch (_e) {
          // ignore
        }
      }
    }

    function applyInit(payload) {
      if (!payload || !Array.isArray(payload.cells)) {
        return;
      }
      render(payload);
    }

    function tryReadLocalStorage() {
      try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return false;
        }
        applyInit(JSON.parse(raw));
        return true;
      } catch (_e) {
        return false;
      }
    }

    function send(mode) {
      if (state.busy || (state.missing && state.missing.length)) {
        return;
      }
      if (!state.cells.length) {
        setStatus("Aucune cellule PALO.DATAC.", "error");
        return;
      }
      var action = currentAction();
      var value = action.value === "none" ? "" : document.getElementById("value").value;
      var path = collectPath();
      var prefs = rememberChoice();
      state.busy = true;
      document.getElementById("btn-apply").disabled = true;
      document.getElementById("btn-cancel").disabled = true;
      setStatus("Ecriture...", "");
      Office.context.ui.messageParent(JSON.stringify({
        type: "write",
        mode: mode,
        action: action.id,
        value: value,
        path: path,
        prefs: prefs
      }), { targetOrigin: "*" });
    }

    function onResult(payload) {
      state.busy = false;
      document.getElementById("btn-apply").disabled = false;
      document.getElementById("btn-cancel").disabled = false;
      setStatus(payload && payload.message ? payload.message : "Ecriture refusee.", "error");
    }

    function cancel() {
      if (state.busy) {
        return;
      }
      Office.context.ui.messageParent(JSON.stringify({ type: "cancel" }), { targetOrigin: "*" });
    }

    Office.onReady(function () {
      applyOfficeTheme();
      tryReadLocalStorage();
      document.getElementById("action").addEventListener("change", function () {
        applyActionFields();
        var input = document.getElementById("value");
        input.disabled = Boolean(state.missing && state.missing.length) || currentAction().value === "none";
        if (currentAction().value !== "none") {
          try {
            input.focus();
          } catch (_focus) {
            // ignore
          }
        }
      });
      document.getElementById("btn-apply").addEventListener("click", function () {
        send(state.writeMode === "bulk" ? "bulk" : "replace");
      });
      document.getElementById("btn-cancel").addEventListener("click", cancel);
      document.getElementById("value").addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {
          send(state.writeMode === "bulk" ? "bulk" : "replace");
        }
      });

      function onParentMessage(arg) {
        try {
          var payload = JSON.parse(String(arg && arg.message ? arg.message : ""));
          if (payload && payload.type === "init") {
            applyInit(payload);
            return;
          }
          if (payload && payload.type === "result") {
            onResult(payload);
          }
        } catch (_e) {
          // ignore
        }
      }

      if (Office.context && Office.context.ui && typeof Office.context.ui.addHandlerAsync === "function") {
        Office.context.ui.addHandlerAsync(
          Office.EventType.DialogParentMessageReceived,
          onParentMessage,
          function (asyncResult) {
            if (asyncResult.status === Office.AsyncResultStatus.Succeeded) {
              try {
                Office.context.ui.messageParent("palo-datac-write-ready", { targetOrigin: "*" });
              } catch (_e) {
                if (!state.cells.length && !tryReadLocalStorage()) {
                  setStatus("Impossible de joindre Excel.", "error");
                }
              }
            }
          }
        );
      }
    });
  </script>
</body>
</html>
