<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Attribut</title>
  <link rel="icon" href="/palo-excel-addin/favicon.ico" type="image/x-icon">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --palo-bg: #f3f2f1;
      --palo-surface: #ffffff;
      --palo-surface-alt: #faf9f8;
      --palo-border: #edebe9;
      --palo-text: #323130;
      --palo-text-secondary: #605e5c;
      --palo-hover: #f3f2f1;
      --palo-active: #edebe9;
      --palo-input-bg: #ffffff;
      --palo-input-border: #8a8886;
      --palo-focus: #0078d4;
      --palo-button: #0078d4;
      --palo-button-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --palo-bg: #1f1f1f;
        --palo-surface: #292827;
        --palo-surface-alt: #252423;
        --palo-border: #3b3a39;
        --palo-text: #ffffff;
        --palo-text-secondary: #c8c6c4;
        --palo-hover: #323130;
        --palo-active: #3b3a39;
        --palo-input-bg: #292827;
        --palo-input-border: #8a8886;
        --palo-focus: #2899f5;
      }
    }
    html.theme-dark { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: var(--palo-text);
      background: var(--palo-bg);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      padding: 10px 12px;
      border-bottom: 1px solid var(--palo-border);
      background: var(--palo-surface);
    }
    .fields {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 12px;
      background: var(--palo-surface-alt);
      border-bottom: 1px solid var(--palo-border);
    }
    .fields-bottom {
      border-bottom: 0;
      border-top: 1px solid var(--palo-border);
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--palo-text-secondary);
      margin-bottom: 4px;
    }
    select, input {
      box-sizing: border-box;
      width: 100%;
      padding: 6px 8px;
      font: inherit;
      color: var(--palo-text);
      background: var(--palo-input-bg);
      border: 1px solid var(--palo-input-border);
      border-radius: 2px;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--palo-focus);
      box-shadow: 0 0 0 1px var(--palo-focus) inset;
    }
    #filter-wrap {
      flex-shrink: 0;
      padding: 8px 12px;
      border-bottom: 1px solid var(--palo-border);
      background: var(--palo-surface-alt);
    }
    #attr-filter {
      box-sizing: border-box;
      width: 100%;
      padding: 6px 10px;
      font: inherit;
      color: var(--palo-text);
      background: var(--palo-input-bg);
      border: 1px solid var(--palo-input-border);
      border-radius: 2px;
      outline: none;
    }
    #attr-filter::placeholder {
      color: var(--palo-text-secondary);
      opacity: 0.9;
    }
    #attr-filter:focus {
      border-color: var(--palo-focus);
      box-shadow: 0 0 0 1px var(--palo-focus) inset;
    }
    #list-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px 0;
      background: var(--palo-bg);
    }
    #attr-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #attr-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--palo-text);
    }
    #attr-list li:hover {
      background: var(--palo-hover);
    }
    #attr-list li:active,
    #attr-list li.selected {
      background: var(--palo-active);
    }
    .attr-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .attr-value {
      flex: 0 0 42%;
      min-height: 1.4em;
      text-align: right;
      color: var(--palo-text);
      cursor: text;
    }
    .attr-value input {
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 1px 6px;
      text-align: right;
      font: inherit;
      color: var(--palo-text);
      background: var(--palo-input-bg);
      border: 1px solid var(--palo-focus);
      border-radius: 2px;
      outline: none;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    button {
      font: inherit;
      min-width: 96px;
      padding: 6px 14px;
      border: 1px solid var(--palo-button);
      border-radius: 2px;
      background: var(--palo-button);
      color: var(--palo-button-text);
      cursor: pointer;
    }
    button.secondary {
      background: var(--palo-surface);
      color: var(--palo-text);
      border-color: var(--palo-input-border);
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    #status {
      min-height: 1.2em;
      color: var(--palo-text-secondary);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Attribut</h1>
  <div class="fields">
    <div>
      <label for="dimension">Dimension</label>
      <select id="dimension"></select>
    </div>
    <div>
      <label for="element">Element</label>
      <select id="element"></select>
    </div>
  </div>
  <div id="filter-wrap">
    <label for="attr-filter" class="visually-hidden">Filtrer</label>
    <input type="search" id="attr-filter" placeholder="Filtrer les attributs..." autocomplete="off" spellcheck="false">
  </div>
  <div id="list-wrap">
    <ul id="attr-list"></ul>
  </div>
  <div class="fields fields-bottom">
    <div id="status"></div>
    <div class="actions">
      <button type="button" id="cancel" class="secondary">Annuler</button>
      <button type="button" id="ok">OK</button>
    </div>
  </div>
  <script>
    var STORAGE_KEY = "palo_eattribut_dialog_v1";
    var state = {
      quiet: false,
      attributes: [],
      attribute: "",
      values: {},
      editing: "",
      focusEditor: false,
      valueToken: 0
    };

    function applyOfficeTheme() {
      var theme = Office.context && Office.context.officeTheme;
      if (!theme) {
        return;
      }
      var root = document.documentElement;
      function setVar(name, value) {
        if (value) {
          root.style.setProperty(name, value);
        }
      }
      setVar("--palo-bg", theme.bodyBackgroundColor);
      setVar("--palo-text", theme.bodyForegroundColor);
      setVar("--palo-surface", theme.controlBackgroundColor || theme.bodyBackgroundColor);
      setVar("--palo-surface-alt", theme.controlBackgroundColor || theme.bodyBackgroundColor);
      setVar("--palo-input-bg", theme.controlBackgroundColor);
      if (theme.isDarkTheme) {
        root.classList.add("theme-dark");
        setVar("--palo-border", "#3b3a39");
        setVar("--palo-text-secondary", "#c8c6c4");
        setVar("--palo-hover", "#323130");
        setVar("--palo-active", "#3b3a39");
        setVar("--palo-input-border", "#8a8886");
        setVar("--palo-focus", "#2899f5");
      }
    }

    function post(obj) {
      if (!Office.context || !Office.context.ui || typeof Office.context.ui.messageParent !== "function") {
        return;
      }
      Office.context.ui.messageParent(JSON.stringify(obj), { targetOrigin: "*" });
    }

    function fillSelect(select, names, current) {
      state.quiet = true;
      select.innerHTML = "";
      (names || []).forEach(function (name) {
        var nm = String(name || "");
        if (!nm) {
          return;
        }
        var opt = document.createElement("option");
        opt.value = nm;
        opt.textContent = nm;
        select.appendChild(opt);
      });
      if (current) {
        var i;
        for (i = 0; i < select.options.length; i += 1) {
          if (select.options[i].value === current) {
            select.value = current;
            break;
          }
        }
      }
      state.quiet = false;
    }

    function selectedAttribute() {
      return state.attribute || "";
    }

    function selectedAttributeType() {
      var i;
      for (i = 0; i < state.attributes.length; i += 1) {
        if (state.attributes[i].name === state.attribute) {
          return Number(state.attributes[i].type || 1);
        }
      }
      return 1;
    }

    function renderAttributes(attributes, current) {
      state.attributes = Array.isArray(attributes) ? attributes : [];
      state.attribute = "";
      var filter = document.getElementById("attr-filter");
      if (filter) {
        filter.value = "";
      }
      if (current) {
        state.attribute = current;
      } else if (state.attributes.length) {
        state.attribute = String(state.attributes[0].name || "");
      }
      paintAttributeList();
    }

    function attributeShownValue(name) {
      if (!state.values || !Object.prototype.hasOwnProperty.call(state.values, name)) {
        return "";
      }
      var raw = state.values[name];
      return raw == null ? "" : String(raw);
    }

    function rememberEditor() {
      var editor = document.querySelector("#attr-list .attr-value input");
      if (!editor) {
        return;
      }
      var row = editor.closest ? editor.closest("li") : null;
      var name = row ? row.getAttribute("data-name") : "";
      if (name) {
        state.values[name] = editor.value;
      }
    }

    function paintAttributeList() {
      rememberEditor();
      var ul = document.getElementById("attr-list");
      var filter = document.getElementById("attr-filter");
      var q = String(filter && filter.value ? filter.value : "").trim().toLowerCase();
      ul.innerHTML = "";
      state.attributes.forEach(function (item) {
        var name = String(item && item.name || "");
        if (!name || (q && name.toLowerCase().indexOf(q) === -1)) {
          return;
        }
        var li = document.createElement("li");
        li.setAttribute("data-name", name);
        if (name === state.attribute) {
          li.classList.add("selected");
        }
        var nameEl = document.createElement("span");
        nameEl.className = "attr-name";
        nameEl.textContent = name;
        var valueEl = document.createElement("span");
        valueEl.className = "attr-value";
        if (state.editing === name) {
          li.classList.add("editing");
          var input = document.createElement("input");
          input.type = "text";
          input.value = attributeShownValue(name);
          input.setAttribute("autocomplete", "off");
          input.setAttribute("spellcheck", "false");
          input.addEventListener("mousedown", function (ev) {
            ev.stopPropagation();
          });
          input.addEventListener("click", function (ev) {
            ev.stopPropagation();
          });
          input.addEventListener("input", function () {
            state.values[name] = input.value;
          });
          input.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter") {
              ev.preventDefault();
              input.blur();
            }
          });
          input.addEventListener("blur", function () {
            state.values[name] = input.value;
            if (state.editing !== name) {
              return;
            }
            state.editing = "";
            li.classList.remove("editing");
            valueEl.textContent = input.value;
          });
          valueEl.appendChild(input);
        } else {
          valueEl.textContent = attributeShownValue(name);
        }
        valueEl.addEventListener("click", function (ev) {
          ev.stopPropagation();
          if (state.editing === name) {
            return;
          }
          state.attribute = name;
          state.editing = name;
          state.focusEditor = true;
          paintAttributeList();
        });
        li.addEventListener("click", function () {
          if (state.attribute === name && state.editing !== name) {
            return;
          }
          state.editing = "";
          state.attribute = name;
          paintAttributeList();
        });
        li.appendChild(nameEl);
        li.appendChild(valueEl);
        ul.appendChild(li);
      });
      var selected = ul.querySelector("li.selected");
      if (selected && typeof selected.scrollIntoView === "function") {
        selected.scrollIntoView({ block: "nearest" });
      }
      if (state.focusEditor) {
        state.focusEditor = false;
        var editor = ul.querySelector(".attr-value input");
        if (editor) {
          editor.focus();
          editor.select();
        }
      }
    }

    function requestValues() {
      var dimension = document.getElementById("dimension").value;
      var element = document.getElementById("element").value;
      if (!dimension || !element) {
        state.values = {};
        state.editing = "";
        paintAttributeList();
        return;
      }
      state.valueToken += 1;
      state.editing = "";
      document.getElementById("status").textContent = "";
      post({
        type: "loadValues",
        token: state.valueToken,
        dimension: dimension,
        element: element,
        attribute: selectedAttribute()
      });
    }

    function applyPayload(payload) {
      if (!payload) {
        return;
      }
      var dim = document.getElementById("dimension");
      var el = document.getElementById("element");
      if (Array.isArray(payload.dimensions)) {
        fillSelect(dim, payload.dimensions, payload.dimension);
      }
      if (Array.isArray(payload.elements)) {
        fillSelect(el, payload.elements, payload.element);
      }
      if (payload.values && typeof payload.values === "object") {
        state.values = payload.values;
      } else if (payload.attribute && payload.value != null) {
        state.values[payload.attribute] = payload.value;
      }
      if (Array.isArray(payload.attributes)) {
        renderAttributes(payload.attributes, payload.attribute);
      }
      document.getElementById("status").textContent = payload.message || (state.attributes.length ? "" : "Aucun attribut pour cette dimension.");
    }

    Office.onReady(function () {
      applyOfficeTheme();
      var dim = document.getElementById("dimension");
      var el = document.getElementById("element");
      var filter = document.getElementById("attr-filter");
      if (filter) {
        filter.addEventListener("input", paintAttributeList);
      }
      dim.addEventListener("change", function () {
        if (state.quiet) {
          return;
        }
        post({ type: "loadDimension", dimension: dim.value });
      });
      el.addEventListener("change", function () {
        if (state.quiet) {
          return;
        }
        requestValues();
      });
      document.getElementById("cancel").addEventListener("click", function () {
        post({ type: "cancel" });
      });
      document.getElementById("ok").addEventListener("click", function () {
        var attribute = selectedAttribute();
        if (!dim.value || !el.value || !attribute) {
          document.getElementById("status").textContent = "Choisissez une dimension, un element et un attribut.";
          return;
        }
        rememberEditor();
        document.getElementById("ok").disabled = true;
        document.getElementById("status").textContent = "";
        post({
          type: "ok",
          dimension: dim.value,
          element: el.value,
          attribute: attribute,
          attributeType: selectedAttributeType(),
          value: attributeShownValue(attribute)
        });
      });

      function onParentMessage(arg) {
        try {
          var payload = JSON.parse(String(arg && arg.message ? arg.message : ""));
          if (payload.type === "init" || payload.type === "dimensionData") {
            applyPayload(payload);
            document.getElementById("ok").disabled = false;
            return;
          }
          if (payload.type === "values") {
            if (Number(payload.token) !== state.valueToken) {
              return;
            }
            state.values = payload.values && typeof payload.values === "object" ? payload.values : {};
            state.editing = "";
            paintAttributeList();
            if (payload.message) {
              document.getElementById("status").textContent = String(payload.message);
            }
            return;
          }
          if (payload.type === "error") {
            document.getElementById("ok").disabled = false;
            document.getElementById("status").textContent = String(payload.message || "Echec de l'enregistrement.");
          }
        } catch (_e) {
        }
      }

      if (Office.context && Office.context.ui && typeof Office.context.ui.addHandlerAsync === "function") {
        Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, onParentMessage, function () {
          try {
            post({ type: "ready" });
          } catch (_e) {
          }
        });
      }
      try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if (raw) {
          applyPayload(JSON.parse(raw));
        }
      } catch (_storage) {
      }
    });
  </script>
</body>
</html>
