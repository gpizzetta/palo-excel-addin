<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Palo OLAP Add-in</title>
  <link rel="icon" href="/palo-excel-addin/favicon.ico" type="image/x-icon">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="./assets/taskpane.css?v=1.0.3.38">
</head>
<body>
  <main class="app">
    <section class="card" id="connection-section">
      <h2>Connexion</h2>
      <label for="conn-name">Nom</label>
      <input id="conn-name" type="text" placeholder="LOCAL">
      <label for="conn-url">URL Palo</label>
      <input id="conn-url" type="text" value="https://palo.example.com" placeholder="https://votre-serveur-palo">
      <label for="conn-user">Utilisateur</label>
      <input id="conn-user" type="text" value="admin">
      <label for="conn-password">Mot de passe</label>
      <input id="conn-password" type="password">
      <label for="connection-list">Connexion active</label>
      <select id="connection-list">
        <option value="">-- Selectionner --</option>
      </select>
      <div class="row">
        <button id="save-connection" type="button">Enregistrer</button>
        <button id="test-connection" type="button">Tester</button>
        <button id="delete-connection" type="button" class="danger">Supprimer</button>
      </div>
      <div class="status-banner" id="status-banner">
        <span class="status-icon" id="status-icon" aria-hidden="true"></span>
        <pre id="status-log">Pret.</pre>
      </div>
    </section>

    <p class="version-line version-line--footer">
      Version <strong id="plugin-version">1.0.3.38</strong>
    </p>
  </main>

  <!-- functions.js = bundle (palo-api + fonctions PALO.*). Modele 1.0.2.6 : un seul script ici. -->
  <script src="./functions.js?v=1.0.3.38"></script>
  <script src="./assets/palo-ename-ribbon.js?v=1.0.3.38"></script>
  <script src="./commands.js?v=1.0.3.38"></script>
  <script src="./assets/taskpane.js?v=1.0.3.38"></script>
</body>
</html>
